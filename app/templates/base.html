<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong>{{ app_name }}</strong></li></ul>
      {% if user %}
      <ul>
        <li><a href="/ventas/nueva">Vender</a></li>
        <li><a href="/ventas">Ventas</a></li>
        <li><a href="/productos">Productos</a></li>
        <li><a href="/stock">Stock</a></li>
        {% if user.rol.value == "admin" %}
        <li><a href="/clientes">Clientes</a></li>
        <li><a href="/proveedores">Proveedores</a></li>
        {% endif %}
        <li>{{ user.nombre }} ({{ user.rol.value }})</li>
        <li>
          <form method="post" action="/logout" style="margin:0">
            <button type="submit" class="outline secondary">Salir</button>
          </form>
        </li>
      </ul>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
