{% set es_admin = user.rol.value == "admin" %}
{% for e in errores %}<p><mark>{{ e }}</mark></p>{% endfor %}
{% for a in avisos %}<p><mark>Stock insuficiente — {{ a }}</mark></p>{% endfor %}
{% if lineas %}
<figure>
<table>
  <thead>
    <tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr>
  </thead>
  <tbody>
  {% for l in lineas %}
    <tr>
      <td>{{ l.producto.nombre }} — {{ l.unidad.nombre }}</td>
      <td>
        {% if l.m2_entregados is not none %}
          {{ "%g"|format(l.cantidad_pedida) }} m² pedidos<br>
          <small>{{ l.piezas }} {{ l.producto.unidad_base }} = {{ "%.2f"|format(l.m2_entregados) }} m²</small>
        {% else %}
          {{ "%g"|format(l.cantidad_pedida) }} {{ l.unidad.nombre }}
          {% if l.unidad.tipo.value == "caja" %}<br><small>{{ l.piezas }} {{ l.producto.unidad_base }}</small>{% endif %}
        {% endif %}
      </td>
      <td>
        S/ {{ "%.2f"|format(l.precio_unitario) }}
        {% if es_admin %}<br><small>{% if l.precio_manual %}manual{% else %}{{ l.precio.etiqueta }}{% endif %}</small>{% endif %}
      </td>
      <td>S/ {{ "%.2f"|format(l.subtotal) }}</td>
    </tr>
  {% endfor %}
  </tbody>
  <tfoot>
    <tr><th colspan="3">Total</th><th>S/ {{ "%.2f"|format(total) }}</th></tr>
  </tfoot>
</table>
</figure>
{% elif not errores %}
<p><small>Agrega productos para ver el total.</small></p>
{% endif %}
